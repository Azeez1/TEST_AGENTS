<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
  <title id="title">The exceptional AI forward-deployed engineer</title>
  <desc id="description">Twelve capabilities grouped into four connected stages: discover and decide, build the system, run it in production, and make AI dependable. The full loop runs from customer outcome to measured production impact.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1427"/>
      <stop offset="0.55" stop-color="#101D34"/>
      <stop offset="1" stop-color="#0A1426"/>
    </linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59E2DA"/>
      <stop offset="0.5" stop-color="#8AA8FF"/>
      <stop offset="1" stop-color="#D79BFF"/>
    </linearGradient>
    <linearGradient id="bottomBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123D49"/>
      <stop offset="0.52" stop-color="#25345C"/>
      <stop offset="1" stop-color="#4B2D5B"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#020817" flood-opacity="0.32"/>
    </filter>
    <style>
      text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .eyebrow { font-size: 17px; font-weight: 750; letter-spacing: 3px; fill: #82A0C6; }
      .headline { font-size: 58px; font-weight: 800; letter-spacing: -1.6px; fill: #F5F8FF; }
      .subhead { font-size: 23px; font-weight: 450; fill: #B9C9E3; }
      .phase { font-size: 21px; font-weight: 800; letter-spacing: 1.6px; }
      .phaseNote { font-size: 18px; font-weight: 500; fill: #B1C1D9; }
      .cardTitle { font-size: 24px; font-weight: 750; fill: #F6F9FF; }
      .cardDesc { font-size: 18px; font-weight: 450; fill: #AFC2DF; }
      .cardNumber { font-size: 18px; font-weight: 800; }
      .footerTitle { font-size: 21px; font-weight: 800; fill: #FFFFFF; }
      .footerText { font-size: 20px; font-weight: 500; fill: #DCE9FA; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="url(#background)"/>
  <circle cx="1500" cy="45" r="320" fill="#285D8C" opacity="0.13"/>
  <circle cx="100" cy="1130" r="330" fill="#6C3980" opacity="0.10"/>
  <rect x="64" y="47" width="7" height="110" rx="3.5" fill="url(#headerGlow)"/>
  <text x="98" y="70" class="eyebrow">THE FULL-STACK FDE</text>
  <text x="96" y="130" class="headline">The exceptional AI FDE</text>
  <text x="98" y="166" class="subhead">Twelve capabilities. Four connected stages. One end-to-end outcome.</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="64" y="198" width="1472" height="192" rx="27" fill="#152D3C" stroke="#2A6470" stroke-width="1.5"/>
  </g>
  <rect x="64" y="198" width="9" height="192" rx="4.5" fill="#55D8D0"/>
  <text x="105" y="243" class="phase" fill="#69E2D9">01  DISCOVER &amp; DECIDE</text>
  <text x="566" y="243" class="phaseNote">Find the real problem and define what success means</text>
  <g>
    <rect x="105" y="267" width="430" height="96" rx="18" fill="#19394A" stroke="#367883"/>
    <circle cx="139" cy="297" r="17" fill="#2C7778"/><text x="139" y="303" text-anchor="middle" class="cardNumber" fill="#E5FFFA">1</text>
    <text x="170" y="302" class="cardTitle">Customer discovery</text>
    <text x="170" y="337" class="cardDesc">Workflows · constraints · outcomes</text>
    <rect x="585" y="267" width="430" height="96" rx="18" fill="#19394A" stroke="#367883"/>
    <circle cx="619" cy="297" r="17" fill="#2C7778"/><text x="619" y="303" text-anchor="middle" class="cardNumber" fill="#E5FFFA">2</text>
    <text x="650" y="302" class="cardTitle">Product judgment</text>
    <text x="650" y="337" class="cardDesc">Priority · scope · adoption</text>
    <rect x="1065" y="267" width="430" height="96" rx="18" fill="#19394A" stroke="#367883"/>
    <circle cx="1099" cy="297" r="17" fill="#2C7778"/><text x="1099" y="303" text-anchor="middle" class="cardNumber" fill="#E5FFFA">11</text>
    <text x="1130" y="302" class="cardTitle">Field leadership</text>
    <text x="1130" y="337" class="cardDesc">Trust · decisions · communication</text>
  </g>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="64" y="412" width="1472" height="192" rx="27" fill="#1A2C48" stroke="#4666A1" stroke-width="1.5"/>
  </g>
  <rect x="64" y="412" width="9" height="192" rx="4.5" fill="#83A8FF"/>
  <text x="105" y="457" class="phase" fill="#A6BFFF">02  BUILD THE SYSTEM</text>
  <text x="566" y="457" class="phaseNote">Turn a design into working software and data flows</text>
  <g>
    <rect x="105" y="481" width="430" height="96" rx="18" fill="#20365B" stroke="#4D71AF"/>
    <circle cx="139" cy="511" r="17" fill="#486EC0"/><text x="139" y="517" text-anchor="middle" class="cardNumber" fill="#F2F6FF">3</text>
    <text x="170" y="516" class="cardTitle">Software engineering</text>
    <text x="170" y="551" class="cardDesc">Python · APIs · tests · debugging</text>
    <rect x="585" y="481" width="430" height="96" rx="18" fill="#20365B" stroke="#4D71AF"/>
    <circle cx="619" cy="511" r="17" fill="#486EC0"/><text x="619" y="517" text-anchor="middle" class="cardNumber" fill="#F2F6FF">4</text>
    <text x="650" y="516" class="cardTitle">Data &amp; integrations</text>
    <text x="650" y="551" class="cardDesc">SQL · schemas · webhooks · MCP</text>
    <rect x="1065" y="481" width="430" height="96" rx="18" fill="#20365B" stroke="#4D71AF"/>
    <circle cx="1099" cy="511" r="17" fill="#486EC0"/><text x="1099" y="517" text-anchor="middle" class="cardNumber" fill="#F2F6FF">5</text>
    <text x="1130" y="516" class="cardTitle">System design</text>
    <text x="1130" y="551" class="cardDesc">Scale · consistency · failure</text>
  </g>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="64" y="626" width="1472" height="192" rx="27" fill="#292943" stroke="#745B95" stroke-width="1.5"/>
  </g>
  <rect x="64" y="626" width="9" height="192" rx="4.5" fill="#BF9AF2"/>
  <text x="105" y="671" class="phase" fill="#D7B8FF">03  RUN IN PRODUCTION</text>
  <text x="566" y="671" class="phaseNote">Deploy safely, protect data, detect and recover from failures</text>
  <g>
    <rect x="105" y="695" width="430" height="96" rx="18" fill="#342D53" stroke="#876CA9"/>
    <circle cx="139" cy="725" r="17" fill="#7656A4"/><text x="139" y="731" text-anchor="middle" class="cardNumber" fill="#FAF3FF">6</text>
    <text x="170" y="730" class="cardTitle">Networking &amp; cloud</text>
    <text x="170" y="765" class="cardDesc">HTTP · TLS · VPC · compute</text>
    <rect x="585" y="695" width="430" height="96" rx="18" fill="#342D53" stroke="#876CA9"/>
    <circle cx="619" cy="725" r="17" fill="#7656A4"/><text x="619" y="731" text-anchor="middle" class="cardNumber" fill="#FAF3FF">7</text>
    <text x="650" y="730" class="cardTitle">DevOps &amp; reliability</text>
    <text x="650" y="765" class="cardDesc">CI/CD · monitoring · recovery</text>
    <rect x="1065" y="695" width="430" height="96" rx="18" fill="#342D53" stroke="#876CA9"/>
    <circle cx="1099" cy="725" r="17" fill="#7656A4"/><text x="1099" y="731" text-anchor="middle" class="cardNumber" fill="#FAF3FF">8</text>
    <text x="1130" y="730" class="cardTitle">Security &amp; governance</text>
    <text x="1130" y="765" class="cardDesc">Identity · secrets · privacy</text>
  </g>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="64" y="840" width="1472" height="192" rx="27" fill="#3A2D36" stroke="#A77A63" stroke-width="1.5"/>
  </g>
  <rect x="64" y="840" width="9" height="192" rx="4.5" fill="#F2BA7B"/>
  <text x="105" y="885" class="phase" fill="#FFD09B">04  MAKE AI DEPENDABLE</text>
  <text x="566" y="885" class="phaseNote">Measure real behavior and improve the platform</text>
  <g>
    <rect x="105" y="909" width="430" height="96" rx="18" fill="#483343" stroke="#B28770"/>
    <circle cx="139" cy="939" r="17" fill="#B87960"/><text x="139" y="945" text-anchor="middle" class="cardNumber" fill="#FFF5E8">9</text>
    <text x="170" y="944" class="cardTitle">AI &amp; agent engineering</text>
    <text x="170" y="979" class="cardDesc">Models · retrieval · tools</text>
    <rect x="585" y="909" width="430" height="96" rx="18" fill="#483343" stroke="#B28770"/>
    <circle cx="619" cy="939" r="17" fill="#B87960"/><text x="619" y="945" text-anchor="middle" class="cardNumber" fill="#FFF5E8">10</text>
    <text x="650" y="944" class="cardTitle">Evals &amp; controls</text>
    <text x="650" y="979" class="cardDesc">Metrics · regressions · fallbacks</text>
    <rect x="1065" y="909" width="430" height="96" rx="18" fill="#483343" stroke="#B28770"/>
    <circle cx="1099" cy="939" r="17" fill="#B87960"/><text x="1099" y="945" text-anchor="middle" class="cardNumber" fill="#FFF5E8">12</text>
    <text x="1130" y="944" class="cardTitle">Platform learning</text>
    <text x="1130" y="979" class="cardDesc">Reuse · feedback · playbooks</text>
  </g>

  <path d="M800 391 V410 M800 605 V624 M800 819 V838" stroke="#A9BCD8" stroke-width="3" opacity="0.65"/>
  <path d="M793 405 L800 414 L807 405 M793 619 L800 628 L807 619 M793 833 L800 842 L807 833" fill="none" stroke="#A9BCD8" stroke-width="3" opacity="0.65" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="64" y="1056" width="1472" height="75" rx="20" fill="url(#bottomBand)" stroke="#67849F" stroke-width="1"/>
  <text x="102" y="1090" class="footerTitle">THE THROUGH-LINE</text>
  <text x="377" y="1090" class="footerText">Customer problem → working system → safe production → measured impact</text>
  <text x="103" y="1115" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#A5BED9">Synthesis of OpenAI and Anthropic FDE role expectations · Detailed notes: FDE-CAPABILITY-MAP.md</text>
</svg>
