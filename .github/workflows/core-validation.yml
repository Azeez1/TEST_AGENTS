name: Core contracts
on:
  push:
    paths:
      - '**/*.py'
      - '**/agents/*.md'
      - '.codex/**'
      - '**/config/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/core-validation.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.28
      - run: uv sync --locked --group voice-tests
      - run: uv run --no-sync python tools/project_health.py --tests
